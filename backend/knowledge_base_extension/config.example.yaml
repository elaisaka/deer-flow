plugins:
  - use: knowledge_base_extension:install
    enabled: true
    required: true
    config:
      enabled: true
      data_dir: /var/lib/deerflow-knowledge
      parser_dependencies: /var/lib/deerflow-knowledge/python
      credentials_path: /run/deerflow-local-files/approval-client.json
      origins: [http://localhost:2026, http://127.0.0.1:2026]
      rag:
        embedding:
          provider: ollama
          url: http://host.docker.internal:11434/api/embed
          model: bge-m3
          dimension: 1024
          # Enable only after installing/verifying this local embedding model.
          allow_send: false
          timeout: 20
          retries: 1
        index:
          chunk_chars: 1200
          overlap: 150
          max_chunks: 512
          max_document_chars: 1000000
          batch_size: 16
          index_timeout: 180
          top_k: 6
          context_chars: 8000
          min_score: 0.25
          max_candidates: 10000
