# Append to the operator-owned config.yaml plugins list; contains no credentials.
plugins:
  - use: file_organization_extension:install
    enabled: true
    required: true
    config:
      enabled: true
      credentials_path: /run/deerflow-local-files/approval-client.json
      origins:
        - http://localhost:2026
        - http://127.0.0.1:2026
